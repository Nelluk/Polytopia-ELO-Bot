# Upstream development beta using an already managed Linux PostgreSQL server.
# Set COMPOSE_FILE=compose.beta.yaml in .env, then use docker compose directly.

x-beta-runtime: &beta-runtime
  build:
    context: .
    dockerfile: deploy/container/Dockerfile
    args:
      POLYBOT_SOURCE_CHECKPOINT: ${POLYBOT_SOURCE_CHECKPOINT:?Set the exact clean Git HEAD in .env}
      POLYBOT_RUNTIME_UID: ${POLYBOT_RUNTIME_UID:-1000}
      POLYBOT_RUNTIME_GID: ${POLYBOT_RUNTIME_GID:-1000}
  image: ${POLYBOT_BOT_IMAGE:-polybot-beta:local}
  environment:
    POLYBOT_ENV: development
    POLYBOT_RESTART_SUPERVISOR: compose
    POLYBOT_BETA_OPERATOR_CONTEXT: compose
    POLYBOT_BETA_CONTROL: enabled
    POLYBOT_BETA_STARTUP_SYNC: disabled
    POLYBOT_BETA_CHECKPOINT: ${POLYBOT_SOURCE_CHECKPOINT:?Set the exact clean Git HEAD in .env}
    POLYBOT_BETA_APPLICATION_ID: "479029527553638401"
    POLYBOT_BETA_GUILD_ID: "478571892832206869"
    POLYBOT_BETA_DATABASE: polytopia_dev
    POLYBOT_BETA_DATABASE_ROLE: polybot_dev
  init: true
  user: "${POLYBOT_RUNTIME_UID:-1000}:${POLYBOT_RUNTIME_GID:-1000}"
  read_only: true
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  tmpfs:
    - /tmp:size=256m,mode=1777
  volumes:
    - type: bind
      source: ./deploy/container/config.development.ini
      target: /app/config.development.ini
      read_only: true
      bind:
        create_host_path: false
    - type: bind
      source: ./deploy/container/server_settings_dev.py
      target: /app/server_settings_dev.py
      read_only: true
      bind:
        create_host_path: false
    - polybot_images:/app/data/development/images
    - polybot_logs:/app/logs/development
    - type: bind
      source: ${POSTGRES_SOCKET_DIR:-/var/run/postgresql}
      target: /var/run/postgresql
      read_only: true
  stop_signal: SIGINT
  stop_grace_period: 45s
  pids_limit: 256
  mem_limit: ${POLYBOT_BOT_MEMORY_LIMIT:-1g}
  cpus: ${POLYBOT_BOT_CPU_LIMIT:-1.0}

services:
  bot:
    <<: *beta-runtime
    command: ["python", "scripts/run_development_beta.py", "--skip_tasks"]
    restart: unless-stopped

  schema:
    <<: *beta-runtime
    profiles: ["tools"]
    entrypoint: ["python", "scripts/bootstrap_development_database.py"]
    command: []
    restart: "no"

volumes:
  polybot_images:
  polybot_logs:
