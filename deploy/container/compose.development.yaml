name: polybot-development

x-bot-service: &bot-service
  build:
    context: ../..
    dockerfile: deploy/container/Dockerfile
    args:
      PYTHON_IMAGE: ${POLYBOT_PYTHON_IMAGE:-python:3.12.13-slim-bookworm}
      UV_IMAGE: ${POLYBOT_UV_IMAGE:-ghcr.io/astral-sh/uv:0.11.32}
      POLYBOT_SOURCE_CHECKPOINT: ${POLYBOT_SOURCE_CHECKPOINT:?Run the deployment doctor and set the exact Git checkpoint}
  image: ${POLYBOT_BOT_IMAGE:-polybot-development:local}
  environment:
    POLYBOT_ENV: development
    POLYBOT_RESTART_SUPERVISOR: compose
  init: true
  user: "10001:10001"
  read_only: true
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  tmpfs:
    - /tmp:size=256m,mode=1777
  volumes:
    - ./config.development.ini:/app/config.development.ini:ro
    - ./server_settings_dev.py:/app/server_settings_dev.py:ro
    - polybot_images:/app/data/development/images
    - polybot_logs:/app/logs/development
  stop_signal: SIGINT
  stop_grace_period: 45s
  pids_limit: 256
  mem_limit: ${POLYBOT_BOT_MEMORY_LIMIT:-1g}
  cpus: ${POLYBOT_BOT_CPU_LIMIT:-1.0}

services:
  postgres:
    image: ${POLYBOT_POSTGRES_IMAGE:-postgres:18.4-bookworm}
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_admin_password
      PGDATA: /var/lib/postgresql/18/docker
    secrets:
      - postgres_admin_password
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped
    stop_grace_period: 60s
    pids_limit: 256
    mem_limit: ${POLYBOT_POSTGRES_MEMORY_LIMIT:-768m}
    cpus: ${POLYBOT_POSTGRES_CPU_LIMIT:-1.0}

  database-provision:
    image: ${POLYBOT_POSTGRES_IMAGE:-postgres:18.4-bookworm}
    profiles: ["tools"]
    environment:
      POLYBOT_ENV: development
      PGHOST: postgres
      PGPORT: "5432"
      PGDATABASE: postgres
      PGUSER: postgres
      POSTGRES_ADMIN_PASSWORD_FILE: /run/secrets/postgres_admin_password
      POLYBOT_DATABASE_PASSWORD_FILE: /run/secrets/polybot_database_password
    depends_on:
      postgres:
        condition: service_healthy
    secrets:
      - postgres_admin_password
      - polybot_database_password
    volumes:
      - ./provision-development-database.sh:/usr/local/bin/provision-development-database:ro
    entrypoint: ["/bin/sh", "/usr/local/bin/provision-development-database"]
    restart: "no"

  schema:
    <<: *bot-service
    profiles: ["tools"]
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: ["python", "scripts/bootstrap_development_database.py"]
    command: []
    restart: "no"

  bot:
    <<: *bot-service
    depends_on:
      postgres:
        condition: service_healthy
    command: ["python", "bot.py", "--skip_tasks"]
    restart: "on-failure:5"

volumes:
  postgres_data:
  polybot_images:
  polybot_logs:

secrets:
  postgres_admin_password:
    file: ./secrets/postgres-admin-password.txt
  polybot_database_password:
    file: ./secrets/polybot-database-password.txt
