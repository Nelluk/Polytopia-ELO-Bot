name: polybot-development

x-bot-service: &bot-service
  build:
    context: ../..
    dockerfile: deploy/container/Dockerfile
    args:
      PYTHON_IMAGE: ${POLYBOT_PYTHON_IMAGE:-python:3.12.13-slim-bookworm@sha256:4766d8b510c428e595d74b9cc5bbb2fae8e26316fffb4adc89908d79aacd58a2}
      UV_IMAGE: ${POLYBOT_UV_IMAGE:-ghcr.io/astral-sh/uv:0.11.32@sha256:df4cae8f3a96d175e2e5f992e597550000edbe78fdc2594d5cd8de1a217f504c}
      POLYBOT_SOURCE_CHECKPOINT: ${POLYBOT_SOURCE_CHECKPOINT:?Run the deployment doctor and set the exact Git checkpoint}
      POLYBOT_RUNTIME_UID: ${POLYBOT_RUNTIME_UID:?Run the deployment doctor and set the private-input owner UID}
      POLYBOT_RUNTIME_GID: ${POLYBOT_RUNTIME_GID:?Run the deployment doctor and set the private-input owner GID}
  image: ${POLYBOT_BOT_IMAGE:-polybot-development:local}
  environment:
    POLYBOT_ENV: development
    POLYBOT_RESTART_SUPERVISOR: compose
    POLYBOT_BETA_CONTROL: enabled
    POLYBOT_BETA_STARTUP_SYNC: disabled
    POLYBOT_BETA_CHECKPOINT: ${POLYBOT_SOURCE_CHECKPOINT:?Run the deployment doctor and set the exact Git checkpoint}
    POLYBOT_BETA_APPLICATION_ID: "479029527553638401"
    POLYBOT_BETA_GUILD_ID: "478571892832206869"
    POLYBOT_BETA_DATABASE: polytopia_dev
    POLYBOT_BETA_DATABASE_ROLE: polybot_dev
  init: true
  user: "${POLYBOT_RUNTIME_UID}:${POLYBOT_RUNTIME_GID}"
  read_only: true
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  tmpfs:
    - /tmp:size=256m,mode=1777
  volumes:
    - ./config.development.ini:/app/config.development.ini:ro
    - ./server_settings_dev.py:/app/server_settings_dev.py:ro
    - polybot_images:/app/data/development/images
    - polybot_logs:/app/logs/development
  stop_signal: SIGINT
  stop_grace_period: 45s
  pids_limit: 256
  mem_limit: ${POLYBOT_BOT_MEMORY_LIMIT:-1g}
  cpus: ${POLYBOT_BOT_CPU_LIMIT:-1.0}

services:
  postgres:
    image: ${POLYBOT_POSTGRES_IMAGE:-postgres:18.4-bookworm@sha256:882236b897e39051d2368c5ccc6cda944904723506b2dfc97f2a8f5bc9afa382}
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_admin_password
      PGDATA: /var/lib/postgresql/18/docker
    secrets:
      - postgres_admin_password
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped
    stop_grace_period: 60s
    pids_limit: 256
    mem_limit: ${POLYBOT_POSTGRES_MEMORY_LIMIT:-768m}
    cpus: ${POLYBOT_POSTGRES_CPU_LIMIT:-1.0}

  database-provision:
    image: ${POLYBOT_POSTGRES_IMAGE:-postgres:18.4-bookworm@sha256:882236b897e39051d2368c5ccc6cda944904723506b2dfc97f2a8f5bc9afa382}
    profiles: ["tools"]
    environment:
      POLYBOT_ENV: development
      PGHOST: postgres
      PGPORT: "5432"
      PGDATABASE: postgres
      PGUSER: postgres
      POSTGRES_ADMIN_PASSWORD_FILE: /run/secrets/postgres_admin_password
      POLYBOT_DATABASE_PASSWORD_FILE: /run/secrets/polybot_database_password
    depends_on:
      postgres:
        condition: service_healthy
    secrets:
      - postgres_admin_password
      - polybot_database_password
    volumes:
      - ./provision-development-database.sh:/usr/local/bin/provision-development-database:ro
    entrypoint: ["/bin/sh", "/usr/local/bin/provision-development-database"]
    restart: "no"

  database-backup:
    image: ${POLYBOT_POSTGRES_IMAGE:-postgres:18.4-bookworm@sha256:882236b897e39051d2368c5ccc6cda944904723506b2dfc97f2a8f5bc9afa382}
    profiles: ["recovery"]
    user: "${POLYBOT_RECOVERY_UID:-1000}:${POLYBOT_RECOVERY_GID:-1000}"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=64m,mode=1777
    environment:
      POLYBOT_ENV: development
      POLYBOT_SOURCE_CHECKPOINT: ${POLYBOT_SOURCE_CHECKPOINT:?Run the deployment doctor and set the exact Git checkpoint}
      PGHOST: postgres
      PGPORT: "5432"
      PGDATABASE: postgres
      PGUSER: postgres
    depends_on:
      postgres:
        condition: service_healthy
    secrets:
      - postgres_admin_password
    volumes:
      - ./backups:/backups
      - ./backup-development-database.sh:/usr/local/bin/backup-development-database:ro
    entrypoint: ["/bin/sh", "/usr/local/bin/backup-development-database"]
    restart: "no"

  restore-postgres:
    image: ${POLYBOT_POSTGRES_IMAGE:-postgres:18.4-bookworm@sha256:882236b897e39051d2368c5ccc6cda944904723506b2dfc97f2a8f5bc9afa382}
    profiles: ["recovery"]
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_admin_password
      PGDATA: /var/lib/postgresql/18/docker
    secrets:
      - postgres_admin_password
    volumes:
      - postgres_restore_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: "no"
    stop_grace_period: 60s
    pids_limit: 256
    mem_limit: ${POLYBOT_POSTGRES_MEMORY_LIMIT:-768m}
    cpus: ${POLYBOT_POSTGRES_CPU_LIMIT:-1.0}

  database-restore-drill:
    image: ${POLYBOT_POSTGRES_IMAGE:-postgres:18.4-bookworm@sha256:882236b897e39051d2368c5ccc6cda944904723506b2dfc97f2a8f5bc9afa382}
    profiles: ["recovery"]
    user: "${POLYBOT_RECOVERY_UID:-1000}:${POLYBOT_RECOVERY_GID:-1000}"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=64m,mode=1777
    environment:
      POLYBOT_ENV: development
      PGHOST: restore-postgres
      PGPORT: "5432"
      PGDATABASE: postgres
      PGUSER: postgres
    depends_on:
      restore-postgres:
        condition: service_healthy
    secrets:
      - postgres_admin_password
      - polybot_database_password
    volumes:
      - ./backups:/backups:ro
      - ./restore-development-database.sh:/usr/local/bin/restore-development-database:ro
    entrypoint: ["/bin/sh", "/usr/local/bin/restore-development-database"]
    restart: "no"

  database-import:
    image: ${POLYBOT_POSTGRES_IMAGE:-postgres:18.4-bookworm@sha256:882236b897e39051d2368c5ccc6cda944904723506b2dfc97f2a8f5bc9afa382}
    profiles: ["recovery"]
    user: "${POLYBOT_RECOVERY_UID:-1000}:${POLYBOT_RECOVERY_GID:-1000}"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=64m,mode=1777
    environment:
      POLYBOT_ENV: development
      PGHOST: postgres
      PGPORT: "5432"
      PGDATABASE: postgres
      PGUSER: postgres
    depends_on:
      postgres:
        condition: service_healthy
    secrets:
      - postgres_admin_password
      - polybot_database_password
    volumes:
      - ./backups:/backups:ro
      - ./import-development-database.sh:/usr/local/bin/import-development-database:ro
    entrypoint: ["/bin/sh", "/usr/local/bin/import-development-database"]
    restart: "no"

  schema:
    <<: *bot-service
    profiles: ["tools"]
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: ["python", "scripts/bootstrap_development_database.py"]
    command: []
    restart: "no"

  guild-bootstrap:
    <<: *bot-service
    profiles: ["tools"]
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: ["python", "scripts/bootstrap_first_guild_configuration.py"]
    command: []
    restart: "no"

  bot:
    <<: *bot-service
    depends_on:
      postgres:
        condition: service_healthy
    command: ["python", "scripts/run_development_beta.py", "--skip_tasks"]
    restart: "on-failure:5"

volumes:
  postgres_data:
  postgres_restore_data:
  polybot_images:
  polybot_logs:

secrets:
  postgres_admin_password:
    file: ./secrets/postgres-admin-password.txt
  polybot_database_password:
    file: ./secrets/polybot-database-password.txt
