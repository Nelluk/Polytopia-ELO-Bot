# Linux-only overlay for `./polybot --mode external-socket`. It is combined
# with compose.development.external-db.yaml and exposes only the configured
# PostgreSQL Unix-socket directory, read-only. It does not start or configure
# PostgreSQL; use external mode instead for a TCP-reachable database.

services:
  schema:
    volumes:
      - type: bind
        source: ${POLYBOT_POSTGRES_SOCKET_DIR:-/var/run/postgresql}
        target: /var/run/postgresql
        read_only: true

  bot:
    volumes:
      - type: bind
        source: ${POLYBOT_POSTGRES_SOCKET_DIR:-/var/run/postgresql}
        target: /var/run/postgresql
        read_only: true
