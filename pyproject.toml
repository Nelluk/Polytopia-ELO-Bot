[project]
name = "polytopia-elo-bot"
version = "0.0.0"
description = "Discord matchmaking, ELO, and league bot for Polytopia"
requires-python = ">=3.12,<3.13"
dependencies = [
    "discord.py==2.3.2",
    "fastapi==0.111.0",
    "google-auth==2.35.0",
    "gspread-asyncio==2.0.0",
    "gunicorn==20.1.0",
    "httptools==0.6.1",
    "matplotlib==3.8.4",
    "pandas==2.2.2",
    "peewee==3.17.5",
    "pillow==10.4.0",
    "psycopg2-binary==2.9.9",
    "pydantic==1.10.16",
    "requests==2.31.0",
    "scipy==1.13.0",
    "uvicorn==0.29.0",
    "uvloop==0.19.0",
]

[dependency-groups]
dev = [
    "pip-audit==2.10.1",
]

[tool.uv]
package = false
# Preserve compatible production-baseline transitive versions until their
# controlled upgrade groups. These constraints do not install packages.
constraint-dependencies = [
    "aiohttp==3.9.5",
    "anyio==3.7.1",
    "gspread==6.0.2",
    "numpy==1.26.4",
    "pyparsing==2.4.7",
    "starlette==0.37.2",
]
