# Alternate example for an operator-managed PostgreSQL server reachable over
# TCP. Copy to the ignored compose.yaml and adapt private mounts as needed.

x-bot-runtime: &bot-runtime
  build:
    context: .
    dockerfile: Dockerfile
    args:
      POLYBOT_UID: ${POLYBOT_UID:-1000}
      POLYBOT_GID: ${POLYBOT_GID:-1000}
  image: ${POLYBOT_IMAGE:-polybot:local}
  environment:
    POLYBOT_ENV: ${POLYBOT_ENV:?Set development or production in .env}
    POLYBOT_RESTART_SUPERVISOR: compose
    POLYBOT_RUNTIME_CONFIG_PATH: /app/runtime-config.ini
    POLYBOT_SERVER_SETTINGS_PATH: /app/runtime-server-settings.py
    POLYBOT_DATABASE_CONFIGURATION: environment
    POLYBOT_DATABASE_HOST: ${POLYBOT_DATABASE_HOST:?Set the PostgreSQL host in .env}
    POLYBOT_DATABASE_PORT: ${POLYBOT_DATABASE_PORT:-5432}
    POLYBOT_DATABASE_NAME: ${POLYBOT_DATABASE_NAME:?Set POLYBOT_DATABASE_NAME in .env}
    POLYBOT_DATABASE_USER: ${POLYBOT_DATABASE_USER:?Set POLYBOT_DATABASE_USER in .env}
    POLYBOT_DATABASE_PASSWORD: ${POLYBOT_DATABASE_PASSWORD:?Set POLYBOT_DATABASE_PASSWORD in .env}
  init: true
  user: "${POLYBOT_UID:-1000}:${POLYBOT_GID:-1000}"
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"
  tmpfs:
    - /tmp:size=256m,mode=1777
  volumes:
    - type: bind
      source: ${POLYBOT_CONFIG_FILE:-./config.ini}
      target: /app/runtime-config.ini
      read_only: true
      bind:
        create_host_path: false
    - type: bind
      source: ${POLYBOT_SERVER_SETTINGS_FILE:-./server_settings.py}
      target: /app/runtime-server-settings.py
      read_only: true
      bind:
        create_host_path: false
    - polybot_images:/app/data
    - polybot_logs:/app/logs
  stop_signal: SIGINT
  stop_grace_period: 45s

services:
  bot:
    <<: *bot-runtime
    restart: unless-stopped

  schema:
    <<: *bot-runtime
    profiles: [tools]
    entrypoint: [python, scripts/manage_schema.py]
    command: []
    restart: "no"

volumes:
  polybot_images:
  polybot_logs:
